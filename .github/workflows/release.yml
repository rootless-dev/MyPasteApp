name: Release

on:
  push:
    branches: [main]

# Releases must not overlap: cancelling one halfway could tag a version whose
# dmg never gets built, so queue instead of cancel.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Reads the Conventional Commits landed on main and keeps a Release PR up to
  # date. Merging that PR is what creates the tag and the GitHub Release, which
  # in turn satisfies the `release_created` condition below.
  #
  # This runs on Linux on purpose: it only talks to the GitHub API, so paying
  # for a macOS runner here would buy nothing.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # RELEASE_PLEASE_TOKEN rather than GITHUB_TOKEN: events raised by the
      # default token never start another workflow run, so the Release PR would
      # open with no CI on it and could never satisfy the required status check
      # that protects main.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Packaging lives in its own reusable workflow so the exact same steps can be
  # started by hand from the Actions tab against any ref, instead of only ever
  # running as a side effect of cutting a release.
  dmg:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/dmg.yml
    permissions:
      contents: write
    with:
      # Build the tag itself, so the artifact provably matches the release
      # rather than whatever main happened to look like afterwards.
      ref: ${{ needs.release-please.outputs.tag_name }}
      release-tag: ${{ needs.release-please.outputs.tag_name }}
