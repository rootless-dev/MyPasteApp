name: Release

on:
  push:
    branches: [main]

# Releases must not overlap: cancelling one halfway could tag a version whose
# dmg never gets built, so queue instead of cancel.
concurrency:
  group: release
  cancel-in-progress: false

jobs:
  # Reads the Conventional Commits landed on main and keeps a Release PR up to
  # date. Merging that PR is what creates the tag and the GitHub Release, which
  # in turn satisfies the `release_created` condition below.
  #
  # This runs on Linux on purpose: it only talks to the GitHub API, so paying
  # for a macOS runner here would buy nothing.
  release-please:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      # RELEASE_PLEASE_TOKEN rather than GITHUB_TOKEN: events raised by the
      # default token never start another workflow run, so the Release PR would
      # open with no CI on it and could never satisfy the required status check
      # that protects main.
      - name: Run release-please
        id: release
        uses: googleapis/release-please-action@v5
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  dmg:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write

    steps:
      # Build the tag itself, so the artifact provably matches the release
      # rather than whatever main happened to look like afterwards.
      - name: Checkout release tag
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      # The version is injected on the command line instead of being written
      # into project.pbxproj: GENERATE_INFOPLIST_FILE is on, so this reaches the
      # app's Info.plist without release-please having to edit a file whose
      # format Xcode owns.
      - name: Build Release configuration
        run: |
          set -o pipefail
          NSUnbufferedIO=YES xcodebuild build \
            -project MyPasteApp.xcodeproj \
            -scheme MyPasteApp \
            -configuration Release \
            -destination 'platform=macOS' \
            -derivedDataPath build \
            MARKETING_VERSION=${{ needs.release-please.outputs.version }} \
            CURRENT_PROJECT_VERSION=${{ github.run_number }}

      - name: Package dmg
        env:
          VERSION: ${{ needs.release-please.outputs.version }}
        run: |
          set -euo pipefail
          APP="build/Build/Products/Release/MyPasteApp.app"
          test -d "$APP"

          # A staging folder with an /Applications symlink gives the familiar
          # drag-to-install window when the dmg is opened.
          STAGING="$(mktemp -d)"
          cp -R "$APP" "$STAGING/"
          ln -s /Applications "$STAGING/Applications"

          DMG="MyPasteApp-${VERSION}.dmg"
          hdiutil create \
            -volname "MyPasteApp ${VERSION}" \
            -srcfolder "$STAGING" \
            -ov -format UDZO \
            "$DMG"
          echo "DMG=$DMG" >> "$GITHUB_ENV"

      - name: Attach dmg to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload \
            "${{ needs.release-please.outputs.tag_name }}" \
            "$DMG" --clobber
